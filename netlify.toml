[build]
  command   = "npm run build"
  publish   = "dist"

# SPA-style fallback is NOT needed because Astro emits a separate static file
# for every public route.

# Cache immutable assets (JS/CSS bundles with content hashes)
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, s-maxage=604800"
