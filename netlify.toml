[build]
  command   = "npm run build"
  publish   = "dist"

# SPA-style fallback is NOT needed because Astro emits a separate static file
# for every public route.

# Cache immutable assets (JS/CSS bundles with content hashes)
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The seven fine-grained categories became four domains; keep old links working.
[[redirects]]
  from   = "/blog/chu-de/logic-hoc/*"
  to     = "/blog/chu-de/toan-hoc/"
  status = 301

[[redirects]]
  from   = "/blog/chu-de/nghich-ly/*"
  to     = "/blog/chu-de/toan-hoc/"
  status = 301

[[redirects]]
  from   = "/blog/chu-de/nhan-thuc-luan/*"
  to     = "/blog/chu-de/triet-hoc/"
  status = 301

[[redirects]]
  from   = "/blog/chu-de/dao-duc-luan/*"
  to     = "/blog/chu-de/triet-hoc/"
  status = 301

[[redirects]]
  from   = "/blog/chu-de/phuong-phap-luan/*"
  to     = "/blog/chu-de/triet-hoc/"
  status = 301
