[build]
  command   = "npm run build"
  publish   = "out"

# SPA-style fallback is NOT needed because Next.js static export
# generates a separate .html file for every route.

# Cache immutable assets (JS/CSS bundles with content hashes)
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, s-maxage=604800"
