name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: No tracked file may match .gitignore
        run: |
          files=$(git ls-files -ci --exclude-standard)
          if [ -n "$files" ]; then echo "$files"; exit 1; fi
      - run: npm run ci
